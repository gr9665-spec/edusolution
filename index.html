<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학점은행제 플래너 허브</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ffffff;--bg2:#f5f5f0;--bg3:#eeeee8;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:rgba(0,0,0,0.12);--border2:rgba(0,0,0,0.22);
  --r:8px;--rl:12px;--navy:#1e3a5f;
  --blue:#1a5fa8;--blue-bg:#e8f0fb;
  --green:#2e6e10;--green-bg:#e8f3de;
  --amber:#7a4b08;--amber-bg:#faeeda;
  --red:#8f2020;--red-bg:#fce8e8;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;font-size:14px;color:var(--text);background:var(--bg3);min-height:100vh}
.app{max-width:1150px;margin:0 auto;background:var(--bg);min-height:100vh;box-shadow:0 0 40px rgba(0,0,0,.08)}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:50}
.topbar h1{font-size:15px;font-weight:600;color:#fff}
.badge{font-size:12px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);border-radius:var(--r);padding:4px 10px;color:#fff}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);padding:0 24px;position:sticky;top:53px;z-index:40;overflow-x:auto}
.tab{padding:11px 16px;font-size:13px;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;display:flex;align-items:center;gap:6px;transition:color .15s;white-space:nowrap}
.tab.active{color:var(--navy);border-bottom-color:var(--navy);font-weight:600}
.tab:hover:not(.active){color:var(--text)}
.panel{display:none;padding:24px}.panel.active{display:block}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px}
.metric{background:var(--bg2);border-radius:var(--r);padding:14px 16px}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.metric-val{font-size:24px;font-weight:700;color:var(--navy)}
.metric-sub{font-size:11px;color:var(--text3);margin-top:2px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-head h3{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.tw{overflow-x:auto;border-radius:var(--rl);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--bg2);text-align:left;padding:8px 10px;color:var(--text2);font-weight:600;border-bottom:1px solid var(--border);font-size:11px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
.btn{background:transparent;border:1px solid var(--border2);border-radius:var(--r);padding:6px 13px;font-size:12px;cursor:pointer;color:var(--text);transition:background .12s;display:inline-flex;align-items:center;gap:5px}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn-primary:hover{background:#16305a}
.btn-green{background:var(--green);color:#fff;border-color:var(--green)}.btn-green:hover{background:#235309}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-icon{padding:5px;width:30px;height:30px;justify-content:center}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;font-weight:500}
.pill-blue{background:var(--blue-bg);color:var(--blue)}
.pill-green{background:var(--green-bg);color:var(--green)}
.pill-amber{background:var(--amber-bg);color:var(--amber)}
.pill-red{background:var(--red-bg);color:var(--red)}
.pill-gray{background:var(--bg2);color:var(--text2)}
input,select,textarea{background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding:8px 10px;font-size:13px;color:var(--text);width:100%;font-family:inherit;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy)}
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:11px;color:var(--text2);font-weight:600}
.fg2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fa{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--rl);padding:22px;width:min(600px,95vw);max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.modal-head h2{font-size:15px;font-weight:700}
.empty{text-align:center;padding:36px 0;color:var(--text2);font-size:13px}
.empty i{font-size:28px;display:block;margin-bottom:8px;opacity:.4}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:var(--r);background:var(--bg2);color:var(--text2);margin:2px}
.progress-bar{height:5px;background:var(--bg3);border-radius:3px;overflow:hidden;margin:4px 0 2px}
.progress-fill{height:100%;background:var(--navy);border-radius:3px;transition:width .4s}
.mkt-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mkt-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--rl);padding:16px}
.mkt-card h4{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:7px}
.sch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.sch-item{background:var(--bg2);border-radius:var(--r);padding:10px 12px;border-left:3px solid var(--blue)}
.sch-item.today-item{border-left-color:var(--green)}
.notice{background:var(--amber-bg);border:1px solid #e8c87a;border-radius:var(--r);padding:10px 14px;font-size:12px;color:var(--amber);margin-bottom:12px}
.reward-group{background:var(--bg2);border-radius:var(--r);padding:12px;margin-bottom:10px}
.reward-group-title{font-size:12px;font-weight:700;color:var(--navy);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.reward-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
.reward-row .code{font-weight:600;min-width:80px;color:var(--text)}
.reward-row input{width:100px;padding:5px 8px;font-size:12px}
.reward-row .unit{color:var(--text2);font-size:11px}
.export-box{background:var(--bg2);border-radius:var(--r);padding:14px;margin-bottom:12px}
.export-box h4{font-size:13px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
pre.copy-data{background:var(--bg);border:1px solid var(--border2);border-radius:var(--r);padding
