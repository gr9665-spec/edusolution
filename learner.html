<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f1f4f9">
<title>나의 학습 현황</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  /* 차분한 톤: 맑은 파랑(주) + 세이지(완료) + 머스터드(주의) + 연보라빛 슬레이트(보조) */
  --bg:#f1f4f9;
  --card:#ffffff; --line:#e1e6ee; --soft:#f6f8fc; --mute:#edf1f7;
  --ink:#1a2536; --ink2:#546077; --ink3:#8691a5;
  --teal:#5f9f8a; --blue:#3162b0; --yellow:#c49a45; --purple:#7f93c2;
  --green-bg:#eff6f3; --green-line:#d0e6dc; --green-ink:#3b7a66;
  --blue-bg:#ebf1fb; --blue-line:#cddbf1; --blue-ink:#2a58a3;
  --warn-bg:#fbf6ec; --warn-line:#ecdcbc; --warn-ink:#8a6420;
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  color:var(--ink);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  padding:20px 16px 40px;
}
.wrap{max-width:1180px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 4px 18px}
.top .brand{font-size:13.5px;font-weight:700;letter-spacing:.08em;color:var(--ink3)}
.top h1{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.01em}
.top .upd{font-size:13.5px;color:var(--ink3);white-space:nowrap}

.grid{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:18px;align-items:stretch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:26px 24px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;color:var(--ink3)}
.rlabel{font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:16px}
.ctitle{font-size:20px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
.chead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.pill{font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:999px;background:var(--green-bg);color:var(--green-ink);display:inline-flex;align-items:center;gap:6px}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal)}
.pill.done{background:var(--blue-bg);color:var(--blue-ink)}
.pill.done::before{background:var(--blue)}
.count{width:36px;height:36px;border-radius:50%;background:var(--blue-bg);color:var(--blue-ink);font-weight:700;font-size:15.5px;display:grid;place-items:center}

/* progress */
.prog{display:grid;grid-template-columns:170px 1fr;gap:28px;align-items:center}
.ring{position:relative;width:170px;height:170px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .mid small{font-size:13px;color:var(--ink2)}
.ring .mid b{font-size:44px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.ring .mid span{font-size:13px;color:var(--ink2)}
.stats{border-top:1px solid var(--line)}
.stats div{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.stats dt{font-size:14px;color:var(--ink2)}
.stats dd{font-size:18px;font-weight:700}
.sep{height:1px;background:var(--line);margin:24px 0 18px}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.step{border-radius:12px;padding:16px;border:1px solid var(--line);background:var(--soft);min-height:96px}
.step .n{font-size:13px;font-weight:700;color:var(--ink3)}
.step .t{font-size:16.5px;font-weight:700;margin:10px 0 8px}
.step .s{font-size:13px;color:var(--ink3)}
.step.done{background:var(--green-bg);border-color:var(--green-line)}
.step.done .n,.step.done .s{color:var(--green-ink)}
.step.doing{background:var(--blue-bg);border-color:var(--blue-line);box-shadow:inset 3px 0 0 var(--blue)}
.step.doing .n,.step.doing .s{color:var(--blue-ink)}

/* route (가로 진행 경로) */
.route{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.rs{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 4px;min-width:0}
.rs::after{content:"";position:absolute;top:15px;left:calc(50% + 18px);right:calc(-50% + 18px);height:3px;border-radius:3px;background:var(--line)}
.rs:last-child::after{display:none}
.rs.fill::after{background:var(--blue)}
.rs .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:14.5px;font-weight:700;background:#fff;border:2px solid var(--line);color:var(--ink3);position:relative;z-index:1}
.rs.done .dot{background:var(--blue);border-color:var(--blue);color:#fff}
.rs.doing .dot{border-color:var(--blue);color:var(--blue);box-shadow:0 0 0 5px var(--blue-bg)}
.rs .rt{margin-top:10px;font-size:15px;font-weight:700;color:var(--ink);white-space:nowrap}
.rs.todo .rt{color:var(--ink3)}
.rs .rw{margin-top:4px;font-size:13px;color:var(--ink2);line-height:1.4;min-height:15px;word-break:keep-all}
.rs .rst{margin-top:6px;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--mute);color:var(--ink3)}
.rs.done .rst{background:var(--blue-bg);color:var(--blue-ink)}
.rs.doing .rst{background:var(--blue);color:#fff}
@media (max-width:420px){ .rs .rt{font-size:14px} .rs .rw{font-size:12.5px} }
/* schedule */
.sched{list-style:none}
.sched li{display:grid;grid-template-columns:68px 1fr 10px;gap:12px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.sched .d{line-height:1.3}
.sched .d b{display:block;font-size:19px;font-weight:700;color:var(--ink);letter-spacing:-.01em}
.sched .d em{display:block;margin-top:3px;font-style:normal;font-weight:600;font-size:13.5px;color:var(--ink2)}
.sched li.today .d b,.sched li.today .d em{color:var(--blue-ink)}
.sched .t{font-size:16px;font-weight:700}
.sched .s{font-size:13px;color:var(--ink3);margin-top:6px}
.sched .dot{width:9px;height:9px;border-radius:50%}

.empty{padding:40px 0;text-align:center;color:var(--ink3);font-size:14.5px;line-height:1.7}

/* goals */
.goals{display:flex;flex-direction:column;gap:14px;margin-top:40px}
.goal{display:grid;grid-template-columns:40px 1fr;gap:18px;align-items:center;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:20px}
.goal .ic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14.5px}
.goal .t{font-size:16px;font-weight:700}
.goal .s{font-size:13px;color:var(--ink2);margin:6px 0 10px}
.goal .tag{display:inline-block;font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--mute);color:var(--ink2)}

/* memo */
.memo{margin-top:18px}
.memo textarea{width:100%;min-height:130px;resize:vertical;border:1px solid var(--line);border-radius:14px;background:var(--soft);padding:14px 16px;font:inherit;font-size:15.5px;line-height:1.7;color:var(--ink)}
.memo textarea:focus{outline:none;border-color:var(--blue);background:#fff}
.msave{font-size:13px;color:var(--ink3);white-space:nowrap}
.mnote{margin-top:8px;font-size:13px;color:var(--ink3)}
/* plan */
.plancard{margin-top:18px}
.plancard summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.plancard summary::-webkit-details-marker{display:none}
.plancard .toggle{font-size:13.5px;font-weight:700;color:var(--blue-ink);background:var(--blue-bg);border-radius:999px;padding:8px 14px;white-space:nowrap}
.plancard .toggle .c,.plancard details[open] .toggle .o{display:none}
.plancard details[open] .toggle .c{display:inline}
.plancard details[open] .toggle{color:var(--ink2);background:var(--mute)}
.ptitle{display:flex;align-items:center;gap:14px}
.picon{flex:none;width:44px;height:44px;border-radius:50%;background:var(--blue);display:grid;place-items:center;box-shadow:0 0 0 5px var(--blue-bg)}
.planwrap{margin-top:14px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:8px}
.planin{min-width:680px}
.swipe{display:none;margin-top:14px;font-size:13px;color:var(--ink3)}
@media (max-width:720px){ .swipe{display:block} }
/* goal link */
.goal .gtip{font-size:12.5px;color:var(--ink2);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:6px 9px;margin:-4px 0 10px;line-height:1.55}
.goal .glink{display:inline-block;margin-left:6px;font-size:13px;font-weight:700;color:var(--blue-ink);background:var(--blue-bg);border-radius:999px;padding:6px 10px;text-decoration:none}
/* checklist */
.check{margin-top:18px}
.check summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.check summary::-webkit-details-marker{display:none}
.check .toggle{font-size:13.5px;font-weight:700;color:var(--blue-ink);background:var(--blue-bg);border-radius:999px;padding:8px 14px;white-space:nowrap}
.check .toggle .c,.check details[open] .toggle .o{display:none}
.check details[open] .toggle .c{display:inline}
.check details[open] .toggle{color:var(--ink2);background:var(--mute)}
.mine{margin-top:16px;border-radius:14px;padding:14px 16px;background:var(--blue-bg);border:1px solid var(--blue-line)}
.mine.warn{background:var(--warn-bg);border-color:var(--warn-line)}
.mine .mh{font-size:15px;font-weight:800;margin-bottom:6px}
.mine ul{padding-left:18px}
.mine li{font-size:14.5px;line-height:1.7;color:var(--ink)}
.mine li.warn{font-weight:600;color:var(--warn-ink)}
.mine .mf{margin-top:6px;font-size:13.5px;color:var(--ink2)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.cbox{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:16px 18px}
.cbox .ch{font-size:16px;font-weight:800;margin-bottom:8px}
.cbox ul{padding-left:18px}
.cbox li{font-size:14px;line-height:1.75;color:var(--ink2);margin-bottom:4px}
.cbox li b{color:var(--ink)}
.check .src{margin-top:10px;font-size:13px;color:var(--ink3)}
@media (max-width:680px){ .cgrid{grid-template-columns:1fr} }
/* notice */
.notice{margin-top:18px}
.nrows{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.nrow{border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:18px}
.nrow.open{background:var(--green-bg);border-color:var(--green-line)}
.nrow .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nrow .t{font-size:16.5px;font-weight:700}
.nrow .when{font-size:20px;font-weight:800;margin:12px 0 6px;letter-spacing:-.01em}
.nrow .s{font-size:13.5px;color:var(--ink2);line-height:1.6}
.chip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--mute);color:var(--ink2);white-space:nowrap}
.chip.on{background:#fff;color:var(--green-ink);box-shadow:0 0 0 1px var(--green-line) inset}
.tip{margin-top:10px;font-size:13.5px;font-weight:600;color:var(--blue-ink);background:var(--blue-bg);border-radius:10px;padding:8px 10px;line-height:1.5}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:20px}
.mo{border-radius:10px;background:var(--soft);border:1px solid var(--line);padding:8px 0 7px;text-align:center;font-size:13px;font-weight:700;color:var(--ink3)}
.mo i{display:flex;justify-content:center;gap:3px;height:6px;margin-top:5px}
.mo i b{width:6px;height:6px;border-radius:50%}
.mo.cur{border-color:var(--ink);color:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend b{width:7px;height:7px;border-radius:50%;display:inline-block}
.foot{margin:22px 4px 0;font-size:13px;color:var(--ink3);line-height:1.7}
.state{max-width:420px;margin:15vh auto;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:36px 24px}
.state h2{font-size:18px;margin-bottom:10px}
.state p{font-size:15px;color:var(--ink2);line-height:1.7}
.demo{display:inline-block;font-size:13px;font-weight:700;color:#b7791f;background:#fff6e0;border-radius:999px;padding:4px 10px;margin-left:8px;vertical-align:middle}

@media (max-width:1020px){
  .grid{grid-template-columns:1fr 1fr}
  .card.p{grid-column:1/-1}
}
@media (max-width:1020px){ .nrows{grid-template-columns:1fr} }
@media (max-width:680px){
  .months{grid-template-columns:repeat(6,1fr)}
  body{padding:16px 16px 32px}
  .top h1{font-size:19px}
  .grid{grid-template-columns:1fr;gap:14px}
  .card{padding:22px 18px}
  .prog{grid-template-columns:1fr;gap:18px;justify-items:center}
  .stats{width:100%}
  .goals{margin-top:6px}
  .sched li{padding:16px 0}
}
</style>

<body>
<div class="wrap" id="app"><div class="state"><p>불러오는 중…</p></div></div>

<script>
/* 데이터: 허브(index.html)가 learnerPortal/{토큰} 문서로 내보냄 (buildPortalData)
   결제·수당·메모 등 내부 정보는 포함하지 않음. 이수학점 등은 derive()가 오늘 날짜 기준으로 계산 */
const FIREBASE_CONFIG = {
  apiKey:"AIzaSyBcxBmx_PbZQ47xDXlEDIaFMejOLnb-TBw",
  authDomain:"edusolution-f2778.firebaseapp.com",
  projectId:"edusolution-f2778",
  appId:"1:671414743520:web:5e445c99617b171abafb85"
};

function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}

// 예시 데이터 (주소에 ?t= 가 없을 때)
const DEMO = {
  name:'김하늘', degree:'전문학사', major:'사회복지', hasPlan:true,
  target:80, owned:6, specials:0,
  sems:[
    {name:'25-2학기',start:'2025-09-16',end:'2025-12-29',credits:18},
    {name:'26-1학기',start:'2026-03-03',end:'2026-06-20',credits:18},
    {name:'26-2학기',start:'2026-09-16',end:'2026-12-29',credits:18},
    {name:'27-1학기',start:'2027-05-01',end:'2027-09-30',credits:20}
  ],
  certs:[{name:'매경테스트 우수',credits:18,kind:'cert',due:'26년 10월',dueDate:addDays(20),done:false,url:'https://exam.mk.co.kr/online_main.php?MM=2'}],
  sched:[
    {date:addDays(1),title:'쪽지시험',sub:'시험',kind:'exam'},
    {date:addDays(3),title:'과제 제출 마감',sub:'과제 관리',kind:'task'},
    {date:addDays(5),title:'토론 마감',sub:'토론 참여',kind:'discuss'},
    {date:addDays(9),title:'중간고사',sub:'시험',kind:'exam'}
  ],
  updatedAt:iso(new Date())
};

const SEM_DAYS=112; // 종료일이 없을 때만 쓰는 추정치(약 16주)

// 마지막 종강일 → 학위수여 시기 (cb.or.kr: 2월 학위는 1/15, 8월 학위는 7/15까지 종강)
function degreeTermFor(end){
  const y=+end.slice(0,4), md=end.slice(5);
  if(md<='01-15') return `${y}.02`;
  if(md<='07-15') return `${y}.08`;
  return `${y+1}.02`;
}
// 학점은행제 기준 (cb.or.kr 제도이용 주의사항)
const LIMIT_SEM=24, LIMIT_YEAR=42, LIMIT_EDU_BA=105, LIMIT_EDU_AA=60, MIN_CB=18;
// 종강일 기준 학기/연도: 1년=3/1~다음해 2월말, 1학기=3~8월, 2학기=9~2월
function termKey(end){
  const y=+end.slice(0,4), m=+end.slice(5,7);
  const ay=m>=3?y:y-1;
  return {year:ay, term:(m>=3&&m<=8)?1:2};
}
function personalChecks(r,sems,remaining,expected,today){
  const out=[];
  const dated=sems.filter(s=>s.end);
  const todo=new Set(remaining);
  // 학기당 24 / 연간 42 (남은 학기가 포함된 구간만)
  const bySem={}, byYear={};
  dated.forEach(s=>{
    const k=termKey(s.end), sk=`${k.year}-${k.term}`, yk=String(k.year);
    (bySem[sk]=bySem[sk]||{k,c:0,todo:false}).c+=s.credits; if(todo.has(s)) bySem[sk].todo=true;
    (byYear[yk]=byYear[yk]||{y:k.year,c:0,todo:false}).c+=s.credits; if(todo.has(s)) byYear[yk].todo=true;
  });
  Object.values(bySem).filter(v=>v.todo&&v.c>LIMIT_SEM).forEach(v=>out.push({lv:'warn',
    t:`${v.k.year}년 ${v.k.term}학기(종강일 기준)에 ${v.c}학점이 계획돼 있어요. 한 학기 최대 ${LIMIT_SEM}학점까지만 인정돼요.`}));
  Object.values(byYear).filter(v=>v.todo&&v.c>LIMIT_YEAR).forEach(v=>out.push({lv:'warn',
    t:`${v.y}.3~${v.y+1}.2 사이에 ${v.c}학점이 계획돼 있어요. 1년 최대 ${LIMIT_YEAR}학점까지만 인정돼요.`}));
  // 한 교육원 최대 인정
  const aa=/전문학사/.test(r.degree||''), lim=aa?LIMIT_EDU_AA:LIMIT_EDU_BA;
  const byEdu={};
  sems.forEach(s=>{ if(s.edu) byEdu[s.edu]=(byEdu[s.edu]||0)+s.credits; });
  Object.entries(byEdu).filter(([,c])=>c>lim).forEach(([e,c])=>out.push({lv:'warn',
    t:`${e}에서 ${c}학점이 계획돼 있어요. ${aa?'전문학사':'학사'}는 한 교육원에서 최대 ${lim}학점까지만 인정돼요.`}));
  // 학점은행 수업 18학점 이상
  const cb=sems.reduce((a,s)=>a+s.credits,0);
  if(r.hasPlan&&sems.length&&cb<MIN_CB) out.push({lv:'warn',
    t:`학점은행 수업으로 들을 학점이 ${cb}학점이에요. 학위를 받으려면 ${MIN_CB}학점 이상 필요해요.`});
  // 학습자등록·마지막 종강 마감 (예상 완료 기준)
  if(/^\d{4}\.(02|08)$/.test(expected)){
    const y=+expected.slice(0,4), feb=expected.endsWith('02');
    const regBy=feb?`${y-1}-10-31`:`${y}-04-30`;
    if(regBy>=today) out.push({lv:'info',
      t:`${y}년 ${feb?2:8}월 학위 예정이에요. 아직 학습자등록 전이라면 ${feb?`${y-1}년 10월`:`${y}년 4월`}까지 꼭 등록해야 해요.`});
    out.push({lv:'info',t:`마지막 수업은 ${y}년 ${feb?'1월 15일':'7월 15일'}까지 끝나야 ${feb?2:8}월 학위에 반영돼요.`});
  }
  return out;
}

// 허브가 보낸 원본 값 → 화면용 값 (오늘 날짜 기준으로 계산)
function derive(r){
  const today=iso(new Date());
  const sems=(r.sems||[]).map(s=>{
    let end=s.end||'';
    if(s.start&&!end){const e=new Date(s.start+'T00:00:00');e.setDate(e.getDate()+SEM_DAYS);end=iso(e);} // 종료일 없을 때만 16주로 추정
    return {...s,end,credits:+s.credits||0};
  });
  // 이수완료 체크(done)된 학기는 일자와 상관없이 완료, 나머지는 일자로 판단
  const finished=sems.filter(s=>s.done||(s.start&&s.end<today));
  const remaining=sems.filter(s=>!finished.includes(s));
  const current=remaining.find(s=>s.start&&s.start<=today&&today<=s.end);
  const upcoming=remaining.filter(s=>s.start>today).sort((a,b)=>a.start.localeCompare(b.start))[0];
  const allDone=sems.length>0&&remaining.length===0;

  // 자격증·독학사: 허브에서 '취득완료' 체크한 것만 완료 학점 (예전 데이터는 모든 학기 끝나면 반영)
  const certs=Array.isArray(r.certs)?r.certs:null;
  const pendingCerts=(certs||[]).filter(c=>!c.done);
  const certEarned=c=>Array.isArray(c.subjects)?c.subjects.filter(x=>x.done).reduce((a,x)=>a+(+x.credits||0),0):(c.done?(+c.credits||0):0);
  const specEarned=certs?certs.reduce((a,c)=>a+certEarned(c),0):(allDone?(+r.specials||0):0);

  const target=+r.target||0;
  let earned=(+r.owned||0)+finished.reduce((a,s)=>a+s.credits,0)+specEarned;
  const planned=(+r.owned||0)+sems.reduce((a,s)=>a+s.credits,0)+(+r.specials||0);

  let thisSem=0, thisSemName='';
  if(current){thisSem=current.credits;thisSemName=current.name;}
  else if(upcoming){thisSem=upcoming.credits;thisSemName=upcoming.name+' 예정';}
  else if(!r.hasPlan){thisSem=+r.thisSemFallback||0;}

  // 예상 완료: 마지막 학기 종료 → 8월(후기) 또는 다음해 2월(전기) 학위
  let expected='-';
  // 남은 학기 중 일자 빈 학기가 있으면 '-'
  // 아직 안 딴 자격증의 목표 시기도 포함
  const ends=[...remaining.filter(s=>s.start).map(s=>s.end),...pendingCerts.map(c=>c.dueDate).filter(Boolean)].sort();
  const last=ends.pop();
  if(last&&target&&planned>=target&&remaining.every(s=>s.start)){
    expected=degreeTermFor(last);
  }

  const reached=target>0&&earned>=target;
  // 진행 경로 각 단계 아래에 표시할 시기
  const ym=d=>d?`${d.slice(2,4)}.${d.slice(5,7)}`:'';
  const datedAll=sems.filter(s=>s.start).sort((a,b)=>a.start.localeCompare(b.start));
  const period=datedAll.length?`${ym(datedAll[0].start)} ~ ${ym(datedAll.reduce((m,s)=>s.end>m?s.end:m,''))}`:'';
  const steps=[
    {label:'상담',status:'done',when:r.counselDate?r.counselDate.replace(/-/g,'.'):''},
    {label:'학습설계',status:r.hasPlan&&sems.length?'done':'doing',when:sems.length?`${sems.length}개 학기 계획`:''},
    {label:'과정진행',status:allDone&&!pendingCerts.length?'done':(finished.length||current?'doing':'todo'),
      when:current?`${current.name} 수강 중`:period},
    {label:'학위·자격',status:reached?'doing':'todo',when:expected!=='-'?`${expected} 예정`:''}
  ];
  if(!r.hasPlan){steps[2].status=current||finished.length?'doing':'todo';}

  const goals=[];
  if(r.degree||target) goals.push({icon:'학',title:'학위취득',
    desc:[r.major,r.degree].filter(Boolean).join(' ')+(target?` · 목표 ${target}학점`:''),
    status:reached?'학점 충족':'진행 중',color:'teal'});
  (certs||[]).forEach(c=>{
    const isD=c.kind==='doksa', word=isD?'합격':'취득';
    const subs=Array.isArray(c.subjects)?c.subjects:[];
    const passed=subs.filter(x=>x.done).length;
    const dd=c.dueDate?Math.round((new Date(c.dueDate+'T00:00:00')-new Date(today+'T00:00:00'))/864e5):null;
    let status;
    if(c.done) status=`${word} 완료`;
    else status=[isD&&subs.length>1&&passed?`${passed}/${subs.length}과목 ${word}`:'',
                 dd!=null?(dd>=0?`D-${dd}`:'목표일 지남'):''].filter(Boolean).join(' · ')||`${word} 예정`;
    goals.push({icon:isD?'독':'자',title:c.name,
      desc:[isD&&subs.length?subs.map(x=>(x.done?'✓':'')+x.name).join('·'):'',
            c.due?`${c.due}까지 ${word}`:'',c.credits?`${c.credits}학점 인정`:''].filter(Boolean).join(' · '),
      status,color:c.done?'teal':(isD?'purple':'blue'),url:c.url||'',tip:c.done?'':(c.tip||'')});
  });
  const sched=[...(r.sched||[])];
  pendingCerts.filter(c=>c.dueDate).forEach(c=>sched.push({date:c.dueDate,title:`${c.name} ${c.kind==='doksa'?'합격':'취득'} 목표`,sub:'자격증',kind:'admin'}));
  sched.sort((a,b)=>a.date.localeCompare(b.date));
  goals.push({icon:'행',title:'행정 절차',desc:'학점인정·학위신청',status:reached?'진행 예정':'예정',color:'purple'});

  const checks=personalChecks(r,sems,remaining,expected,today);
  return {checks,reached,planHtml:r.planHtml||'',name:r.name,target,earned:Math.min(earned,target||earned),thisSem,thisSemName,expected,steps,
    schedules:sched,goals,updatedAt:r.updatedAt};
}

const KIND_COLOR={class:'var(--teal)',task:'var(--blue)',exam:'var(--yellow)',discuss:'var(--teal)',admin:'var(--purple)',etc:'var(--purple)'};
const GOAL_BG={teal:'#5f9f8a',blue:'#3162b0',purple:'#7f93c2'};
const DOW=['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function weekStart(d){const x=new Date(d);x.setHours(0,0,0,0);const w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x}

function schedRows(list){
  const today=new Date();today.setHours(0,0,0,0);
  const ws=weekStart(today), nextWs=new Date(ws);nextWs.setDate(ws.getDate()+7);
  const limit=new Date(ws);limit.setDate(ws.getDate()+14);
  const rows=(list||[])
    .map(s=>({...s,_d:new Date(s.date+'T00:00:00')}))
    .filter(s=>s._d>=today&&s._d<limit)
    .sort((a,b)=>a._d-b._d)
    .slice(0,6);
  return rows.map(s=>{
    const isNext=s._d>=nextWs;
    const md=`${s._d.getMonth()+1}.${s._d.getDate()}`;
    const isToday=+s._d===+today;
    return `<li class="${isToday?'today':''}">
      <div class="d"><b>${md}</b><em>${isToday?'오늘':(isNext?'다음 주 '+DOW[s._d.getDay()].slice(0,1):DOW[s._d.getDay()])}</em></div>
      <div><div class="t">${esc(s.title)}</div><div class="s">${esc(s.sub||'')}</div></div>
      <span class="dot" style="background:${KIND_COLOR[s.kind]||KIND_COLOR.etc}"></span>
    </li>`;
  });
}

// ── 학점은행제 신청 일정 (모든 학습자 공통) ──
// 학습자등록·학점인정신청: 1·4·7·10월 / 학위신청: 12.15~1.15, 6.15~7.15
const CREDIT_MONTHS=[1,4,7,10];
function dday(d){const t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}
function creditWindow(now){
  const m=now.getMonth()+1;
  if(CREDIT_MONTHS.includes(m)) return {open:true};
  let y=now.getFullYear(), nm=CREDIT_MONTHS.find(x=>x>m);
  if(!nm){nm=1;y++;}
  return {open:false,next:new Date(y,nm-1,1)};
}
function degreeWindow(now){
  const y=now.getFullYear();
  const wins=[[new Date(y-1,11,15),new Date(y,0,15)],[new Date(y,5,15),new Date(y,6,15)],[new Date(y,11,15),new Date(y+1,0,15)]];
  const t=new Date(now);t.setHours(0,0,0,0);
  const cur=wins.find(([a,b])=>t>=a&&t<=b);
  if(cur) return {open:true,end:cur[1]};
  return {open:false,next:wins.map(w=>w[0]).find(a=>a>t)};
}
function noticeHtml(d){
  const now=new Date(), cw=creditWindow(now), dw=degreeWindow(now);
  const nextTxt=dt=>`${dt.getFullYear()}년 ${dt.getMonth()+1}월${dt.getDate()>1?' '+dt.getDate()+'일':''}부터`;
  const chip=(open,dt)=>open?'<span class="chip on">지금 신청 기간</span>':`<span class="chip">D-${dday(dt)}</span>`;
  const cm=now.getMonth()+1;
  const months=Array.from({length:12},(_,i)=>{
    const m=i+1, credit=CREDIT_MONTHS.includes(m), deg=[1,6,7,12].includes(m);
    return `<div class="mo ${m===cm?'cur':''}">${m}월<i>${credit?'<b style="background:var(--blue)"></b>':''}${deg?'<b style="background:var(--purple)"></b>':''}</i></div>`;
  }).join('');
  return `
  <section class="card notice">
    <div class="chead">
      <div><div class="eyebrow">NOTICE</div><div class="ctitle">학점은행제 신청 일정</div></div>
    </div>
    <div class="nrows">
      <div class="nrow ${cw.open?'open':''}">
        <div class="h"><span class="t">학습자등록</span>${chip(cw.open,cw.next)}</div>
        <div class="when">1 · 4 · 7 · 10월</div>
        <div class="s">처음 한 번만 하면 돼요.<br>학점인정신청과 같이 해도 괜찮아요.</div>
        ${cw.open?'':`<div class="s" style="margin-top:6px">다음 기간: ${nextTxt(cw.next)}</div>`}
      </div>
      <div class="nrow ${cw.open?'open':''}">
        <div class="h"><span class="t">학점인정신청</span>${chip(cw.open,cw.next)}</div>
        <div class="when">1 · 4 · 7 · 10월</div>
        <div class="s">이수를 마친 학점이 생기면<br>그때그때 바로 신청하는 게 좋아요.</div>
        ${cw.open?'':`<div class="s" style="margin-top:6px">다음 기간: ${nextTxt(cw.next)}</div>`}
      </div>
      <div class="nrow ${dw.open?'open':''}">
        <div class="h"><span class="t">학위신청</span>${chip(dw.open,dw.next)}</div>
        <div class="when">12.15~1.15 · 6.15~7.15</div>
        <div class="s">목표 학점을 모두 채운 뒤 신청해요.</div>
        ${dw.open?`<div class="s" style="margin-top:6px">이번 기간: ${dw.end.getMonth()+1}월 ${dw.end.getDate()}일까지</div>`:`<div class="s" style="margin-top:6px">다음 기간: ${nextTxt(dw.next)}</div>`}
        ${d.reached?'<div class="tip">🎓 목표 학점을 모두 채웠어요! 학위신청 기간에 꼭 신청하세요.</div>':''}
      </div>
    </div>
    <div class="months">${months}</div>
    <div class="legend"><span><b style="background:var(--blue)"></b>학습자등록 · 학점인정신청</span><span><b style="background:var(--purple)"></b>학위신청</span></div>
  </section>`;
}

            <li>이름이 같은 과목(띄어쓰기만 다른 것 포함)은 두 번 들어도 <b>1과목만</b> 인정돼요.</li>
            <li>자격증·독학사 시험 합격으로 받는 학점은 학기·연간 제한에 포함되지 않아요.</li>
          </ul>
        </div>
        <div class="cbox">
          <div class="ch">🎓 학위 받으려면</div>
          <ul>
            <li>학사 <b>140학점</b>(전공 60·교양 30 이상), 전문학사 <b>80학점</b>(전공 45·교양 15 이상)이 필요해요.</li>
            <li>전공마다 정해진 <b>전공필수</b> 과목을 꼭 들어야 해요.</li>
            <li>학점은행 수업(원격수업 등)으로 <b>18학점 이상</b>은 반드시 들어야 해요.</li>
            <li>학습자등록은 학위신청 75일 전까지! 2월 학위는 <b>전년도 10월</b>, 8월 학위는 <b>4월</b>까지예요.</li>
            <li>마지막 수업은 2월 학위는 <b>1월 15일</b>, 8월 학위는 <b>7월 15일</b>까지 끝나야 해요.</li>
            <li>학점을 다 채워도 <b>학위신청 기간에 신청</b>해야 학위가 나와요.</li>
          </ul>
        </div>
      </div>
      <p class="src">출처: 국가평생교육진흥원 학점은행제(cb.or.kr) 제도이용 주의사항·학위수여 요건</p>
    </details>
  </section>`;
}

function showState(title,msg){
  document.getElementById('app').innerHTML=`<div class="state"><h2>${esc(title)}</h2><p>${esc(msg)}</p></div>`;
}

// ── 나의 메모: learnerMemo/{토큰} = {text, updatedAt} (허브 데이터와 따로 저장) ──
const MEMO_MAX=3000;
function setupMemo(db,token){
  const ta=document.getElementById('memo'), st=document.getElementById('memo-state');
  if(!ta) return;
  const stamp=iso=>{if(!iso)return'';const d=new Date(iso);return `${d.getMonth()+1}.${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} 저장됨`};
  if(!db){ ta.disabled=true; return; }
  const ref=db.collection('learnerMemo').doc(token);
  ref.get().then(s=>{ if(s.exists){ ta.value=s.data().text||''; st.textContent=stamp(s.data().updatedAt); } })
    .catch(e=>console.warn('메모 불러오기 실패',e));
  let timer=null;
  const save=()=>{
    const updatedAt=new Date().toISOString();
    st.textContent='저장 중…';
    ref.set({text:ta.value.slice(0,MEMO_MAX),updatedAt})
      .then(()=>{ st.textContent=stamp(updatedAt); })
      .catch(e=>{ console.warn(e); st.textContent='저장 실패 · 잠시 후 다시 시도'; });
  };
  ta.addEventListener('input',()=>{ st.textContent='입력 중…'; clearTimeout(timer); timer=setTimeout(save,1200); });
  ta.addEventListener('blur',()=>{ if(timer){ clearTimeout(timer); timer=null; save(); } });
}

function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}

(async()=>{
  const q=new URLSearchParams(location.search);
  const token=q.get('t');
  if(!token){ render(derive(DEMO),true); setupMemo(null); return; }
  if(!/^[A-Za-z0-9_-]{16,64}$/.test(token)){ showState('링크를 확인해주세요','주소가 올바르지 않아요. 받은 링크를 다시 눌러주세요.'); return; }
  try{
    const v='10.12.0';
    await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`);
    await loadScript(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`);
    firebase.initializeApp(FIREBASE_CONFIG);
    const db=firebase.firestore();
    const snap=await db.collection('learnerPortal').doc(token).get();
    if(!snap.exists){ showState('정보를 찾을 수 없어요','링크가 만료됐거나 아직 준비 중이에요. 담당 선생님께 문의해주세요.'); return; }
    render(derive(snap.data()),false);
    setupMemo(db,token);
  }catch(e){
    console.error(e);
    showState('잠시 후 다시 시도해주세요','정보를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침 해주세요.');
  }
})();
</script>
